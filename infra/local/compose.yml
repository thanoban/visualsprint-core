name: visualsprint-v3-local
services:
  workspace-qualification-bootstrap:
    image: postgres:17.6-alpine
    profiles: ["qualification"]
    environment:
      PGPASSWORD: local-test-only
    depends_on:
      workspace-db:
        condition: service_healthy
    entrypoint: ["psql"]
    command: ["-h", "workspace-db", "-U", "local_admin", "-d", "postgres", "-v", "ON_ERROR_STOP=1", "-f", "/qualification/init.sql"]
    volumes:
      - ./workspace-qualification-init.sql:/qualification/init.sql:ro
    restart: "no"
  notification-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: local_admin
      POSTGRES_PASSWORD: local-test-only
    ports: ["127.0.0.1:55441:5432"]
    volumes:
      - notification-db:/var/lib/postgresql/data
      - ../../services/notification/local-init.sql:/docker-entrypoint-initdb.d/001-notification.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local_admin -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  intelligence-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: local_admin
      POSTGRES_PASSWORD: local-test-only
    ports: ["127.0.0.1:55438:5432"]
    volumes:
      - intelligence-db:/var/lib/postgresql/data
      - ../../services/intelligence/local-init.sql:/docker-entrypoint-initdb.d/001-intelligence.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local_admin -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  reporting-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: local_admin
      POSTGRES_PASSWORD: local-test-only
    ports: ["127.0.0.1:55439:5432"]
    volumes:
      - reporting-db:/var/lib/postgresql/data
      - ../../services/reporting/local-init.sql:/docker-entrypoint-initdb.d/001-reporting.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local_admin -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  workflow-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: local_admin
      POSTGRES_PASSWORD: local-test-only
    ports: ["127.0.0.1:55440:5432"]
    volumes:
      - workflow-db:/var/lib/postgresql/data
      - ../../services/workflow/local-init.sql:/docker-entrypoint-initdb.d/001-workflow.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local_admin -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  integration-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: local_admin
      POSTGRES_PASSWORD: local-test-only
    ports: ["127.0.0.1:55437:5432"]
    volumes:
      - integration-db:/var/lib/postgresql/data
      - ./integration-init.sql:/docker-entrypoint-initdb.d/001-integration.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local_admin -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  ingest-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: local_admin
      POSTGRES_PASSWORD: local-test-only
    ports: ["127.0.0.1:55436:5432"]
    volumes:
      - ingest-db:/var/lib/postgresql/data
      - ./ingest-init.sql:/docker-entrypoint-initdb.d/001-ingest.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local_admin -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  authz-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: local_admin
      POSTGRES_PASSWORD: local-test-only
    ports: ["127.0.0.1:55435:5432"]
    volumes:
      - authz-db:/var/lib/postgresql/data
      - ./authz-init.sql:/docker-entrypoint-initdb.d/001-authz.sql:ro
      - ../../services/authz/local-application-init.sql:/docker-entrypoint-initdb.d/002-authz-application.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local_admin -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  authz-migrate:
    image: openfga/openfga:v1.22.0
    depends_on:
      authz-db:
        condition: service_healthy
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://vs_authz_migration:local-migration-only@authz-db:5432/authz?sslmode=disable
  authz-grants:
    image: postgres:17.6-alpine
    depends_on:
      authz-migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: local-migration-only
    command:
      [
        "psql",
        "--host=authz-db",
        "--username=vs_authz_migration",
        "--dbname=authz",
        "--file=/runtime-grants.sql",
      ]
    volumes:
      - ./authz-grants.sql:/runtime-grants.sql:ro
  openfga:
    image: openfga/openfga:v1.22.0
    depends_on:
      authz-grants:
        condition: service_completed_successfully
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://vs_authz_runtime:local-runtime-only@authz-db:5432/authz?sslmode=disable
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: local-openfga-only
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_LOG_FORMAT: json
    ports: ["127.0.0.1:4180:8080"]
  account-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: local_admin
      POSTGRES_PASSWORD: local-test-only
    ports: ["127.0.0.1:55434:5432"]
    volumes:
      - account-db:/var/lib/postgresql/data
      - ./account-init.sql:/docker-entrypoint-initdb.d/001-account.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local_admin -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  workspace-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: local_admin
      POSTGRES_PASSWORD: local-test-only
    ports: ["127.0.0.1:55433:5432"]
    volumes:
      - workspace-db:/var/lib/postgresql/data
      - ./workspace-init.sql:/docker-entrypoint-initdb.d/001-workspace.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local_admin -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  notification-db:
  intelligence-db:
  reporting-db:
  workflow-db:
  integration-db:
  ingest-db:
  authz-db:
  account-db:
  workspace-db:
