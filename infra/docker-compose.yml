name: visualsprint

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: visualsprint-db
    environment:
      POSTGRES_USER: visualsprint
      POSTGRES_PASSWORD: visualsprint_dev
      POSTGRES_DB: visualsprint
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visualsprint"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Lean image — no ASR/agents/screen extras. The API only reads and writes
  # Postgres over HTTP; it never touches torch/paddleocr/pyannote, so there's
  # no reason to pay for that build weight here (see backend/Dockerfile).
  api:
    build:
      context: ../backend
      args:
        INSTALL_EXTRAS: ""
    container_name: visualsprint-api
    environment:
      VS_DATABASE_URL: postgresql+psycopg://visualsprint:visualsprint_dev@db:5432/visualsprint
      VS_BLOB_BACKEND: local
      VS_BLOB_LOCAL_DIR: /blobstore
      VS_SECRETSTORE_BACKEND: local
      VS_SECRETSTORE_LOCAL_DIR: /secretstore
      VS_CORS_ALLOWED_ORIGINS: '["http://localhost:3000"]'
    env_file:
      # Optional: most people won't have created backend/.env (it's
      # gitignored by design, see backend/.env.example) -- `required: false`
      # means a fresh checkout still runs, just without vendor/LLM
      # credentials, same graceful degradation as running outside Docker.
      - path: ../backend/.env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - blobstore:/blobstore
      - secretstore:/secretstore
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 30
    depends_on:
      db:
        condition: service_healthy

  # Full image — this is the only service that actually runs pipeline
  # stages (transcribe/screen/understand/...), so it needs every extra.
  # Same blobstore volume as api: Mode D uploads land there via the API
  # container, this is what reads them back out during acquire/transcribe.
  worker:
    build:
      context: ../backend
      args:
        INSTALL_EXTRAS: "asr,agents,screen"
    container_name: visualsprint-worker
    command: ["python", "-m", "app.orchestrator.worker"]
    environment:
      VS_DATABASE_URL: postgresql+psycopg://visualsprint:visualsprint_dev@db:5432/visualsprint
      VS_BLOB_BACKEND: local
      VS_BLOB_LOCAL_DIR: /blobstore
      VS_SECRETSTORE_BACKEND: local
      VS_SECRETSTORE_LOCAL_DIR: /secretstore
    env_file:
      # Optional: most people won't have created backend/.env (it's
      # gitignored by design, see backend/.env.example) -- `required: false`
      # means a fresh checkout still runs, just without vendor/LLM
      # credentials, same graceful degradation as running outside Docker.
      - path: ../backend/.env
        required: false
    volumes:
      - blobstore:/blobstore
      - secretstore:/secretstore
    depends_on:
      db:
        condition: service_healthy

  # Explicit opt-in: these processes consume durable founder-platform outboxes.
  # They do not provision Vexa/STT or qualify live joining. Start only after
  # configuring a consented workspace and its provider binding.
  capture-worker:
    profiles: [founder]
    build:
      context: ../backend
      args:
        INSTALL_EXTRAS: ""
    command: ["python", "-m", "app.capture.worker", "--watch"]
    environment: &founder_environment
      VS_DATABASE_URL: postgresql+psycopg://visualsprint:visualsprint_dev@db:5432/visualsprint
      VS_BLOB_BACKEND: local
      VS_BLOB_LOCAL_DIR: /blobstore
      VS_SECRETSTORE_BACKEND: local
      VS_SECRETSTORE_LOCAL_DIR: /secretstore
    env_file: &founder_env_files
      - path: ../backend/.env
        required: false
    volumes: &founder_volumes
      - blobstore:/blobstore
      - secretstore:/secretstore
    depends_on: &founder_dependencies
      api:
        condition: service_healthy
    restart: unless-stopped

  conversation-worker:
    profiles: [founder]
    build:
      context: ../backend
      args:
        INSTALL_EXTRAS: agents
    command: ["python", "-m", "app.entrypoints.conversation_worker", "--watch"]
    environment: *founder_environment
    env_file: *founder_env_files
    volumes: *founder_volumes
    depends_on: *founder_dependencies
    restart: unless-stopped

  data-rights-worker:
    profiles: [founder]
    build:
      context: ../backend
      args:
        INSTALL_EXTRAS: ""
    command: ["python", "-m", "app.entrypoints.data_rights_worker", "--watch"]
    environment: *founder_environment
    env_file: *founder_env_files
    volumes: *founder_volumes
    depends_on: *founder_dependencies
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      args:
        APP_DEPLOYMENT_TARGET: local
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: visualsprint-frontend
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  dbdata:
  blobstore:
  secretstore:
