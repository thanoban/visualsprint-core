name: Microservices rebuild
on:
  pull_request:
    paths: ["apps/**", "packages/**", "services/**", "tests/**", "infra/local/**", "scripts/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "tsconfig.base.json", "turbo.json", ".github/workflows/microservices.yml"]
  push:
    branches: [main, codex/zedex-web-rebuild]
    paths: ["apps/**", "packages/**", "services/**", "tests/**", "infra/local/**", "scripts/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "tsconfig.base.json", "turbo.json", ".github/workflows/microservices.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.1.3"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm --filter @visualsprint/web exec playwright install --with-deps chromium
      - run: pnpm --filter @visualsprint/web test:browser
      - run: docker compose -f infra/local/compose.yml up -d --wait --quiet-pull
      - run: pnpm test:integration
      - if: always()
        run: docker compose -f infra/local/compose.yml down
