name: Microservices rebuild
on:
  pull_request:
    paths:
      [
        "apps/**",
        "packages/**",
        "services/**",
        "tests/**",
        "infra/local/**",
        "infra/azure/**",
        "infra/containers/**",
        "scripts/**",
        "package.json",
        "pnpm-lock.yaml",
        "pnpm-workspace.yaml",
        "tsconfig.base.json",
        "turbo.json",
        ".github/workflows/microservices.yml",
      ]
  push:
    branches: [main, codex/zedex-web-rebuild]
    paths:
      [
        "apps/**",
        "packages/**",
        "services/**",
        "tests/**",
        "infra/local/**",
        "infra/azure/**",
        "infra/containers/**",
        "scripts/**",
        "package.json",
        "pnpm-lock.yaml",
        "pnpm-workspace.yaml",
        "tsconfig.base.json",
        "turbo.json",
        ".github/workflows/microservices.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  azure-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Acquire checksum-pinned offline Bicep compiler
        shell: bash
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/Azure/bicep/releases/download/v0.48.1/bicep-linux-x64 --output "$RUNNER_TEMP/bicep"
          printf '%s  %s\n' 'b09ec25a9d376c1f8e33ede6ed22b587f915ad68488d5db77a6f9541748c7f6e' "$RUNNER_TEMP/bicep" | sha256sum --check --strict
          chmod u+x "$RUNNER_TEMP/bicep"
      - name: Compile and validate Azure source without cloud credentials
        run: node infra/azure/validate.mjs
        env:
          BICEP_BIN: ${{ runner.temp }}/bicep
      - name: Acquire local PostgreSQL qualification fixture
        run: docker pull postgres:17.6-alpine
      - name: Qualify private database role bootstrap without Azure access
        run: node --test infra/azure/test/bootstrap.test.mjs
        env:
          AZURE_BOOTSTRAP_TEST_ENABLED: "true"
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.1.3"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Check cross-service contracts without Docker or providers
        run: pnpm test:offline
      - run: pnpm build
      - run: pnpm --filter @visualsprint/web exec playwright install --with-deps chromium
      - run: pnpm --filter @visualsprint/web test:browser
      - run: docker compose -f infra/local/compose.yml up -d --wait --quiet-pull
      - name: Provision isolated accepted-review qualification database
        run: docker compose -f infra/local/compose.yml --profile qualification run --rm --no-deps workspace-qualification-bootstrap
      - name: Run integration tests including verified profiles
        run: pnpm test:integration
        env:
          ACCOUNT_PROFILE_TEST_ENABLED: "true"
      - name: Qualify accepted commitments on isolated persistence
        run: pnpm --filter @visualsprint/workspace exec tsx --test test/qualification/commitments.test.ts
      - if: always()
        run: docker compose -f infra/local/compose.yml down
