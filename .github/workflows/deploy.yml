name: Deploy to Cloud Run

# Keyless auth via Workload Identity Federation -- no long-lived GCP JSON key
# ever touches this repo. The WIF provider (github-provider, in the
# visualsprint-agent project) trusts this exact repo by attribute condition;
# see the trust-boundary note at the bottom of this file before changing it.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for google-github-actions/auth's WIF exchange

env:
  REGION: ${{ vars.GCP_REGION }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/visualsprint

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      # --- API: lean image, no ASR/agents/screen extras (docs at the top of
      # backend/Dockerfile explain why) ---
      - name: Build and push api image
        run: |
          docker build backend \
            --build-arg INSTALL_EXTRAS= \
            -t "${REGISTRY}/api:${{ github.sha }}" \
            -t "${REGISTRY}/api:latest"
          docker push "${REGISTRY}/api:${{ github.sha }}"
          docker push "${REGISTRY}/api:latest"

      - name: Deploy api to Cloud Run
        run: |
          gcloud run deploy visualsprint-api \
            --image "${REGISTRY}/api:${{ github.sha }}" \
            --region "$REGION" --project "$PROJECT_ID" \
            --service-account="visualsprint-backend-service-a@${PROJECT_ID}.iam.gserviceaccount.com" \
            --set-secrets="VS_DATABASE_URL=visualsprint-database-url:latest" \
            --quiet

      # --- Agents/worker: full image, runs pipeline stages, needs every
      # extra (torch/paddleocr/pyannote). Deployed as a Cloud Run *Service*
      # like the others -- worker.py's main() now serves a /healthz
      # endpoint alongside its poll loop specifically so this passes Cloud
      # Run's health checks (see app/orchestrator/worker.py). ---
      - name: Build and push agents image
        run: |
          docker build backend \
            --build-arg INSTALL_EXTRAS=asr,agents,screen \
            -t "${REGISTRY}/agents:${{ github.sha }}" \
            -t "${REGISTRY}/agents:latest"
          docker push "${REGISTRY}/agents:${{ github.sha }}"
          docker push "${REGISTRY}/agents:latest"

      - name: Deploy agents to Cloud Run
        run: |
          gcloud run deploy visualsprint-agents \
            --image "${REGISTRY}/agents:${{ github.sha }}" \
            --region "$REGION" --project "$PROJECT_ID" \
            --service-account="visualsprint-backend-service-a@${PROJECT_ID}.iam.gserviceaccount.com" \
            --command python \
            --args="-m,app.orchestrator.worker" \
            --set-secrets="VS_DATABASE_URL=visualsprint-database-url:latest,/secrets/google-speech-credentials.json=visualsprint-google-speech-credentials:latest" \
            --set-env-vars="VS_GOOGLE_CREDENTIALS_JSON=/secrets/google-speech-credentials.json" \
            --no-cpu-throttling \
            --min-instances=1 --max-instances=1 \
            --quiet

      # --- Web: needs the api's live URL baked in at build time (Next.js
      # inlines NEXT_PUBLIC_* into the client bundle) -- fetched fresh
      # rather than hardcoded, so this stays correct if the api service URL
      # ever changes. ---
      - name: Resolve api URL for the frontend build
        id: api_url
        run: |
          URL=$(gcloud run services describe visualsprint-api \
            --region "$REGION" --project "$PROJECT_ID" \
            --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Build and push web image
        run: |
          docker build frontend \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${{ steps.api_url.outputs.url }}" \
            -t "${REGISTRY}/web:${{ github.sha }}" \
            -t "${REGISTRY}/web:latest"
          docker push "${REGISTRY}/web:${{ github.sha }}"
          docker push "${REGISTRY}/web:latest"

      - name: Deploy web to Cloud Run
        run: |
          gcloud run deploy visualsprint-web \
            --image "${REGISTRY}/web:${{ github.sha }}" \
            --region "$REGION" --project "$PROJECT_ID" \
            --quiet

# --- Setup required once, not per-run ---
# Repo variables (Settings -> Secrets and variables -> Actions -> Variables
# tab -- these are non-secret identifiers, WIF needs no secret credential):
#   GCP_PROJECT_ID                = visualsprint-agent
#   GCP_REGION                    = us-west1
#   GCP_WORKLOAD_IDENTITY_PROVIDER = projects/530780341550/locations/global/workloadIdentityPools/github-pool/providers/github-provider
#   GCP_SERVICE_ACCOUNT           = github-actions-deploy@visualsprint-agent.iam.gserviceaccount.com
#
# Trust boundary: the WIF provider's attribute condition currently allows
# BOTH this repo and VisualSprint-Labs/visualsprint-agent (an earlier,
# unrelated scaffold project sharing this same GCP project). Narrow it to
# this repo only once that other repo's access is confirmed no longer
# needed -- see `gcloud iam workload-identity-pools providers update-oidc`.
#
# Database: api and agents both read VS_DATABASE_URL from the Secret
# Manager secret `visualsprint-database-url` (granted to the runtime service
# account visualsprint-backend-service-a@..., NOT the deploy SA above --
# deploying only needs permission to *reference* the secret, not read it).
# That secret currently holds a placeholder
# (postgresql+psycopg://NOT_YET_CONFIGURED:...@example.invalid:5432/...) --
# deploys will keep succeeding but the container will fail its DB connection
# until a real value is added. No code or workflow changes needed once it
# is real -- Cloud Run always resolves `:latest` on each new revision:
#   printf '%s' 'postgresql+psycopg://user:pass@host:5432/db' | \
#     gcloud secrets versions add visualsprint-database-url \
#       --project=visualsprint-agent --data-file=-
# Then redeploy (push, or re-run this workflow) to pick it up. If using
# Supabase specifically, use the Session pooler connection string, not
# Transaction pooler -- transaction-mode pooling can break some
# SQLAlchemy/Alembic behavior.
#
# Google ASR (chirp_2): the agents service mounts
# `visualsprint-google-speech-credentials` (a service-account key JSON for
# visualsprint-asr@visualsprint-agent.iam.gserviceaccount.com, which holds
# only roles/speech.client -- least privilege, recognition calls only) as a
# *file* at /secrets/google-speech-credentials.json via --set-secrets'
# path=secret syntax, and VS_GOOGLE_CREDENTIALS_JSON points at that path
# (app/config.py's field is a file path, not inline JSON content -- see
# app/adapters/asr_google.py). Real key already generated and stored; this
# one is live, not a placeholder. The `api` service does not need it (only
# the agents/worker image calls the ASR cascade).
# Azure Speech (VS_AZURE_SPEECH_KEY/_REGION) and Groq (VS_GROQ_API_KEY) are
# NOT wired here -- both require signing up on the vendor's own site, which
# has to happen outside this repo/workflow before a secret can be created
# for them.
