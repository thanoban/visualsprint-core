name: Deploy to Cloud Run

# Keyless auth via Workload Identity Federation -- no long-lived GCP JSON key
# ever touches this repo. The WIF provider (github-provider, in the
# visualsprint-agent project) trusts this exact repo by attribute condition;
# see the trust-boundary note at the bottom of this file before changing it.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for google-github-actions/auth's WIF exchange

env:
  REGION: ${{ vars.GCP_REGION }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/visualsprint

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      # --- API: lean image, no ASR/agents/screen extras (docs at the top of
      # backend/Dockerfile explain why) ---
      - name: Build and push api image
        run: |
          docker build backend \
            --build-arg INSTALL_EXTRAS= \
            -t "${REGISTRY}/api:${{ github.sha }}" \
            -t "${REGISTRY}/api:latest"
          docker push "${REGISTRY}/api:${{ github.sha }}"
          docker push "${REGISTRY}/api:latest"

      - name: Deploy api to Cloud Run
        run: |
          API_SECRETS="VS_DATABASE_URL=visualsprint-database-url:latest"
          API_SECRETS="${API_SECRETS},VS_OAUTH_STATE_SECRET=visualsprint-oauth-state-secret:latest"
          API_SECRETS="${API_SECRETS},VS_SLACK_OAUTH_CLIENT_ID=visualsprint-slack-oauth-client-id:latest"
          API_SECRETS="${API_SECRETS},VS_SLACK_OAUTH_CLIENT_SECRET=visualsprint-slack-oauth-client-secret:latest"
          API_SECRETS="${API_SECRETS},VS_ZOOM_OAUTH_CLIENT_ID=visualsprint-zoom-oauth-client-id:latest"
          API_SECRETS="${API_SECRETS},VS_ZOOM_OAUTH_CLIENT_SECRET=visualsprint-zoom-oauth-client-secret:latest"
          API_SECRETS="${API_SECRETS},VS_ZOOM_CLIENT_ID=visualsprint-zoom-client-id:latest"
          API_SECRETS="${API_SECRETS},VS_ZOOM_CLIENT_SECRET=visualsprint-zoom-client-secret:latest"
          API_SECRETS="${API_SECRETS},VS_ZOOM_WEBHOOK_SECRET_TOKEN=visualsprint-zoom-webhook-secret-token:latest"
          API_SECRETS="${API_SECRETS},VS_MICROSOFT_OAUTH_CLIENT_ID=visualsprint-microsoft-oauth-client-id:latest"
          API_SECRETS="${API_SECRETS},VS_MICROSOFT_OAUTH_CLIENT_SECRET=visualsprint-microsoft-oauth-client-secret:latest"
          API_SECRETS="${API_SECRETS},VS_JIRA_OAUTH_CLIENT_ID=visualsprint-jira-oauth-client-id:latest"
          API_SECRETS="${API_SECRETS},VS_JIRA_OAUTH_CLIENT_SECRET=visualsprint-jira-oauth-client-secret:latest"
          API_SECRETS="${API_SECRETS},VS_GOOGLE_OAUTH_CLIENT_ID=visualsprint-google-oauth-client-id:latest"
          API_SECRETS="${API_SECRETS},VS_GOOGLE_OAUTH_CLIENT_SECRET=visualsprint-google-oauth-client-secret:latest"
          gcloud run deploy visualsprint-api \
            --image "${REGISTRY}/api:${{ github.sha }}" \
            --region "$REGION" --project "$PROJECT_ID" \
            --service-account="visualsprint-backend-service-a@${PROJECT_ID}.iam.gserviceaccount.com" \
            --set-secrets="$API_SECRETS" \
            --set-env-vars='VS_SUPABASE_URL=https://uktfgmvmtijqpzqnivvi.supabase.co,VS_CORS_ALLOWED_ORIGINS=["https://visualsprint-web-5ieahiycsa-uw.a.run.app"],VS_OAUTH_REDIRECT_BASE_URL=https://visualsprint-api-5ieahiycsa-uw.a.run.app,VS_FRONTEND_BASE_URL=https://visualsprint-web-5ieahiycsa-uw.a.run.app' \
            --allow-unauthenticated \
            --quiet

      # --- Agents/worker: full image, runs pipeline stages, needs every
      # extra (torch/paddleocr/pyannote). Deployed as a Cloud Run *Service*
      # like the others -- worker.py's main() now serves a /healthz
      # endpoint alongside its poll loop specifically so this passes Cloud
      # Run's health checks (see app/orchestrator/worker.py). ---
      - name: Build and push agents image
        run: |
          docker build backend \
            --build-arg INSTALL_EXTRAS=asr,agents,screen \
            -t "${REGISTRY}/agents:${{ github.sha }}" \
            -t "${REGISTRY}/agents:latest"
          docker push "${REGISTRY}/agents:${{ github.sha }}"
          docker push "${REGISTRY}/agents:latest"

      # Scale-to-zero, not always-on: budget-constrained deploy (GCP GenAI
      # App Builder trial credit only, no backing payment method) can't
      # absorb a permanently-open vCPU (~$60-65/month at 1 vCPU + 512Mi
      # regardless of traffic). VS_WORKER_MODE=http switches the entrypoint
      # from an infinite poll loop to an HTTP server that only does work
      # when Cloud Scheduler calls POST /run (see app/orchestrator/
      # worker.py's serve_http/run_bounded_pass and the Cloud Scheduler
      # setup note at the bottom of this file). --timeout is set well above
      # settings.worker_pass_max_seconds (300s) so a deep queue can't be cut
      # off mid-pass. --min-instances=0 and --cpu-throttling are passed
      # EXPLICITLY, not just omitted -- verified empirically that `gcloud
      # run deploy` treats scaling annotations as sticky across revisions:
      # a deploy that previously set --min-instances=1/--no-cpu-throttling
      # and then merely stops passing those flags does NOT reset them, it
      # silently keeps the old (expensive) values. Omitting them here would
      # look correct in this file while the live service kept billing for
      # an always-on instance.
      - name: Deploy agents to Cloud Run
        run: |
          gcloud run deploy visualsprint-agents \
            --image "${REGISTRY}/agents:${{ github.sha }}" \
            --region "$REGION" --project "$PROJECT_ID" \
            --service-account="visualsprint-backend-service-a@${PROJECT_ID}.iam.gserviceaccount.com" \
            --command python \
            --args="-m,app.orchestrator.worker" \
            --set-secrets="VS_DATABASE_URL=visualsprint-database-url:latest,/secrets/google-speech-credentials.json=visualsprint-google-speech-credentials:latest,VS_AZURE_SPEECH_KEY=visualsprint-azure-speech-key:latest,VS_AZURE_SPEECH_REGION=visualsprint-azure-speech-region:latest,VS_HUGGINGFACE_TOKEN=visualsprint-huggingface-token:latest" \
            --set-env-vars="VS_GOOGLE_CREDENTIALS_JSON=/secrets/google-speech-credentials.json,VS_LLM_PROVIDER=gemini,VS_WORKER_MODE=http" \
            --timeout=600 \
            --min-instances=0 --max-instances=2 \
            --cpu-throttling \
            --quiet

      # --- Web: needs the api's live URL baked in at build time (Next.js
      # inlines NEXT_PUBLIC_* into the client bundle) -- fetched fresh
      # rather than hardcoded, so this stays correct if the api service URL
      # ever changes. ---
      - name: Resolve api URL for the frontend build
        id: api_url
        run: |
          URL=$(gcloud run services describe visualsprint-api \
            --region "$REGION" --project "$PROJECT_ID" \
            --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Build and push web image
        run: |
          docker build frontend \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${{ steps.api_url.outputs.url }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -t "${REGISTRY}/web:${{ github.sha }}" \
            -t "${REGISTRY}/web:latest"
          docker push "${REGISTRY}/web:${{ github.sha }}"
          docker push "${REGISTRY}/web:latest"

      - name: Deploy web to Cloud Run
        run: |
          gcloud run deploy visualsprint-web \
            --image "${REGISTRY}/web:${{ github.sha }}" \
            --region "$REGION" --project "$PROJECT_ID" \
            --allow-unauthenticated \
            --quiet

# --- Setup required once, not per-run ---
# Repo variables (Settings -> Secrets and variables -> Actions -> Variables
# tab -- these are non-secret identifiers, WIF needs no secret credential):
#   GCP_PROJECT_ID                = visualsprint-agent
#   GCP_REGION                    = us-west1
#   GCP_WORKLOAD_IDENTITY_PROVIDER = projects/530780341550/locations/global/workloadIdentityPools/github-pool/providers/github-provider
#   GCP_SERVICE_ACCOUNT           = github-actions-deploy@visualsprint-agent.iam.gserviceaccount.com
#   NEXT_PUBLIC_SUPABASE_URL      = https://<project-ref>.supabase.co
#   NEXT_PUBLIC_SUPABASE_ANON_KEY = <anon key, from Supabase project settings -> API>
#     (the anon key is safe as a plain repo Variable, not a Secret -- it is
#     designed to be public and ends up baked into the browser bundle either
#     way; Row Level Security, not secrecy, is what protects the database.
#     NEVER put the service_role key here or anywhere in frontend/ -- it
#     bypasses RLS entirely and must stay backend-only, if used at all.)
#
# Trust boundary: the WIF provider's attribute condition currently allows
# BOTH this repo and VisualSprint-Labs/visualsprint-agent (an earlier,
# unrelated scaffold project sharing this same GCP project). Narrow it to
# this repo only once that other repo's access is confirmed no longer
# needed -- see `gcloud iam workload-identity-pools providers update-oidc`.
#
# Database: api and agents both read VS_DATABASE_URL from the Secret
# Manager secret `visualsprint-database-url` (granted to the runtime service
# account visualsprint-backend-service-a@..., NOT the deploy SA above --
# deploying only needs permission to *reference* the secret, not read it).
# That secret currently holds a placeholder
# (postgresql+psycopg://NOT_YET_CONFIGURED:...@example.invalid:5432/...) --
# deploys will keep succeeding but the container will fail its DB connection
# until a real value is added. No code or workflow changes needed once it
# is real -- Cloud Run always resolves `:latest` on each new revision:
#   printf '%s' 'postgresql+psycopg://user:pass@host:5432/db' | \
#     gcloud secrets versions add visualsprint-database-url \
#       --project=visualsprint-agent --data-file=-
# Then redeploy (push, or re-run this workflow) to pick it up. If using
# Supabase specifically, use the Session pooler connection string, not
# Transaction pooler -- transaction-mode pooling can break some
# SQLAlchemy/Alembic behavior.
#
# Google ASR (chirp_2): the agents service mounts
# `visualsprint-google-speech-credentials` (a service-account key JSON for
# visualsprint-asr@visualsprint-agent.iam.gserviceaccount.com, which holds
# only roles/speech.client -- least privilege, recognition calls only) as a
# *file* at /secrets/google-speech-credentials.json via --set-secrets'
# path=secret syntax, and VS_GOOGLE_CREDENTIALS_JSON points at that path
# (app/config.py's field is a file path, not inline JSON content -- see
# app/adapters/asr_google.py). Real key already generated and stored; this
# one is live, not a placeholder. The `api` service does not need it (only
# the agents/worker image calls the ASR cascade).
# Azure Speech (VS_AZURE_SPEECH_KEY/_REGION) is wired via Secret Manager as
# of 2026-08-11. Groq (VS_GROQ_API_KEY) is still NOT wired -- no account has
# been created for it yet, so there's no value to store.
#
# OAuth clients (Slack, Zoom OAuth app + Zoom Server-to-Server, Microsoft,
# Jira) and VS_OAUTH_STATE_SECRET are wired into the `api` service via
# Secret Manager as of 2026-08-11 (secret names: visualsprint-<vendor>-...,
# see the loop above). GitHub and Linear OAuth apps have not been created
# yet -- VS_GITHUB_OAUTH_CLIENT_ID/SECRET and VS_LINEAR_OAUTH_CLIENT_ID/SECRET
# have no value to store until that happens.
#
# VS_SUPABASE_URL, VS_CORS_ALLOWED_ORIGINS, VS_OAUTH_REDIRECT_BASE_URL, and
# VS_FRONTEND_BASE_URL are set as plain (non-secret) env vars on `api` --
# these are public URLs, not credentials. All four are load-bearing: without
# VS_SUPABASE_URL every authenticated request 401s (JWT verification can't
# reach Supabase's JWKS endpoint); without VS_CORS_ALLOWED_ORIGINS pointing
# at the real web origin, the browser blocks every fetch from the deployed
# frontend to the deployed api. If either Cloud Run URL ever changes (e.g.
# service recreated in a different region), these hardcoded values need a
# manual update here.
#
# Cloud Scheduler (agents/worker trigger, set up once, not per-run):
# visualsprint-agents runs with no --min-instances, so nothing invokes it
# unless something calls POST /run. `visualsprint-agents` is NOT
# --allow-unauthenticated -- deliberately, since this endpoint drains the
# job queue and would otherwise be a free-for-all trigger for anyone who
# finds the URL. Cloud Scheduler needs its own invoker identity:
#   gcloud iam service-accounts create visualsprint-scheduler \
#     --project=visualsprint-agent \
#     --display-name="Cloud Scheduler -> visualsprint-agents /run"
#   gcloud run services add-iam-policy-binding visualsprint-agents \
#     --region=us-west1 --project=visualsprint-agent \
#     --member="serviceAccount:visualsprint-scheduler@visualsprint-agent.iam.gserviceaccount.com" \
#     --role="roles/run.invoker"
#   gcloud scheduler jobs create http visualsprint-agents-run \
#     --project=visualsprint-agent --location=us-west1 \
#     --schedule="*/2 * * * *" \
#     --uri="https://<agents-service-url>/run" \
#     --http-method=POST \
#     --oidc-service-account-email="visualsprint-scheduler@visualsprint-agent.iam.gserviceaccount.com" \
#     --oidc-token-audience="https://<agents-service-url>"
# Every 2 minutes is a deliberate balance: frequent enough that a real
# meeting doesn't sit queued for long, infrequent enough that idle-queue
# invocations (which return almost instantly -- see run_bounded_pass's
# empty-queue test) stay a rounding error next to what the old always-on
# instance cost. Adjust --schedule if that trade-off needs to move either
# way.
