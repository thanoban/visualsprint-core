name: Deploy to Cloud Run

# Keyless auth via Workload Identity Federation -- no long-lived GCP JSON key
# ever touches this repo. The WIF provider (github-provider, in the
# visualsprint-agent project) trusts this exact repo by attribute condition;
# see the trust-boundary note at the bottom of this file before changing it.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for google-github-actions/auth's WIF exchange

env:
  REGION: ${{ vars.GCP_REGION }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/visualsprint

jobs:
  # A red build must not be able to ship. quality.yml is invoked as a
  # reusable workflow rather than duplicated here, so the gate that runs on
  # a PR and the gate that guards a deploy are literally the same file and
  # cannot drift apart.
  quality:
    uses: ./.github/workflows/quality.yml

  build-and-deploy:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep the authentication action current: v3 runs on the supported
      # Node 24 runtime and performs the current GitHub OIDC/WIF exchange.
      # This remains keyless; never replace it with a service-account key.
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      # --- GCS bucket (shared blob store for all services) ---
      # GCS bucket names are globally unique across ALL GCP projects -- a
      # generic name like "visualsprint-blobs" is almost certainly already
      # claimed. Using ${PROJECT_ID} as a suffix guarantees uniqueness since
      # project IDs are globally unique. The || true was suppressing failures
      # from name collisions, causing the next IAM step to fail with "bucket
      # does not exist". The correct idiom: fail loudly on any error OTHER
      # than "already exists" (which is the only safe-to-suppress case).
      - name: Create GCS blob bucket
        run: |
          BUCKET="gs://visualsprint-blobs-${PROJECT_ID}"
          gcloud storage buckets create "${BUCKET}" \
            --project="${PROJECT_ID}" --location="${REGION}" \
            --uniform-bucket-level-access \
            2>&1 | grep -v "already exists" || \
          gcloud storage buckets describe "${BUCKET}" --project="${PROJECT_ID}" \
            > /dev/null

      - name: Grant runtime SA blob access
        run: |
          BUCKET="gs://visualsprint-blobs-${PROJECT_ID}"
          # storage.objectAdmin: agents + bot read/write recordings and screenshots.
          # gsutil does not consistently consume WIF credentials exported by
          # google-github-actions/auth. gcloud storage does, so this stays
          # keyless and works on clean GitHub-hosted runners.
          gcloud storage buckets add-iam-policy-binding "${BUCKET}" \
            --member="serviceAccount:visualsprint-backend-service-a@${PROJECT_ID}.iam.gserviceaccount.com" \
            --role="roles/storage.objectAdmin" \
            --quiet
          # serviceAccountTokenCreator on itself: required for GCS V4 signed
          # URLs without a local key file (the SignBlob IAM API signs via ADC).
          gcloud iam service-accounts add-iam-policy-binding \
            "visualsprint-backend-service-a@${PROJECT_ID}.iam.gserviceaccount.com" \
            --member="serviceAccount:visualsprint-backend-service-a@${PROJECT_ID}.iam.gserviceaccount.com" \
            --role="roles/iam.serviceAccountTokenCreator" \
            --project="${PROJECT_ID}" \
            --quiet

      # --- API: lean image, no ASR/agents/screen extras (docs at the top of
      # backend/Dockerfile explain why) ---
      - name: Build and push api image
        run: |
          docker build backend \
            --build-arg INSTALL_EXTRAS=storage \
            -t "${REGISTRY}/api:${{ github.sha }}" \
            -t "${REGISTRY}/api:latest"
          docker push "${REGISTRY}/api:${{ github.sha }}"
          docker push "${REGISTRY}/api:latest"

      # Scale-to-zero during testing (cost saving): cpu-throttling on,
      # min-instances=0. RTMS WebSocket streaming is unreliable in this mode
      # (CPU is starved between requests; rtms_stopped can land on a different
      # instance than the one holding the stream). That's acceptable while we
      # have no paying users -- Zoom RTMS is Mode A1 fallback; Mode D (upload)
      # and Mode A2 (artifacts) work fine with scale-to-zero. Re-enable
      # --no-cpu-throttling --min-instances=1 only when RTMS is actively
      # needed AND the billing budget allows an always-on instance (~$60/mo).
      - name: Deploy api to Cloud Run
        run: |
          API_SECRETS="VS_DATABASE_URL=visualsprint-database-url:latest"
          API_SECRETS="${API_SECRETS},VS_OAUTH_STATE_SECRET=visualsprint-oauth-state-secret:latest"
          API_SECRETS="${API_SECRETS},VS_SLACK_OAUTH_CLIENT_ID=visualsprint-slack-oauth-client-id:latest"
          API_SECRETS="${API_SECRETS},VS_SLACK_OAUTH_CLIENT_SECRET=visualsprint-slack-oauth-client-secret:latest"
          API_SECRETS="${API_SECRETS},VS_ZOOM_OAUTH_CLIENT_ID=visualsprint-zoom-oauth-client-id:latest"
          API_SECRETS="${API_SECRETS},VS_ZOOM_OAUTH_CLIENT_SECRET=visualsprint-zoom-oauth-client-secret:latest"
          API_SECRETS="${API_SECRETS},VS_ZOOM_CLIENT_ID=visualsprint-zoom-client-id:latest"
          API_SECRETS="${API_SECRETS},VS_ZOOM_CLIENT_SECRET=visualsprint-zoom-client-secret:latest"
          API_SECRETS="${API_SECRETS},VS_ZOOM_WEBHOOK_SECRET_TOKEN=visualsprint-zoom-webhook-secret-token:latest"
          API_SECRETS="${API_SECRETS},VS_ZOOM_ACCOUNT_ID=visualsprint-zoom-account-id:latest"
          API_SECRETS="${API_SECRETS},VS_MICROSOFT_OAUTH_CLIENT_ID=visualsprint-microsoft-oauth-client-id:latest"
          API_SECRETS="${API_SECRETS},VS_MICROSOFT_OAUTH_CLIENT_SECRET=visualsprint-microsoft-oauth-client-secret:latest"
          API_SECRETS="${API_SECRETS},VS_JIRA_OAUTH_CLIENT_ID=visualsprint-jira-oauth-client-id:latest"
          API_SECRETS="${API_SECRETS},VS_JIRA_OAUTH_CLIENT_SECRET=visualsprint-jira-oauth-client-secret:latest"
          API_SECRETS="${API_SECRETS},VS_GOOGLE_OAUTH_CLIENT_ID=visualsprint-google-oauth-client-id:latest"
          API_SECRETS="${API_SECRETS},VS_GOOGLE_OAUTH_CLIENT_SECRET=visualsprint-google-oauth-client-secret:latest"
          gcloud run deploy visualsprint-api \
            --image "${REGISTRY}/api:${{ github.sha }}" \
            --region "$REGION" --project "$PROJECT_ID" \
            --service-account="visualsprint-backend-service-a@${PROJECT_ID}.iam.gserviceaccount.com" \
            --set-secrets="$API_SECRETS" \
            --set-env-vars="VS_SUPABASE_URL=https://uktfgmvmtijqpzqnivvi.supabase.co,VS_CORS_ALLOWED_ORIGINS=[\"https://visualsprint-web-5ieahiycsa-uw.a.run.app\"],VS_OAUTH_REDIRECT_BASE_URL=https://visualsprint-api-5ieahiycsa-uw.a.run.app,VS_FRONTEND_BASE_URL=https://visualsprint-web-5ieahiycsa-uw.a.run.app,VS_BLOB_BACKEND=gcs,VS_GCS_BUCKET=visualsprint-blobs-${PROJECT_ID},VS_SECRETSTORE_BACKEND=gcp,VS_BOT_DISPATCH_ENABLED=true" \
            --allow-unauthenticated \
            --cpu-throttling --min-instances=0 --max-instances=2 \
            --quiet

      # --- Agents/worker: full image, runs pipeline stages, needs every
      # extra (torch/paddleocr/pyannote). Deployed as a Cloud Run *Service*
      # like the others -- worker.py's main() now serves a /healthz
      # endpoint alongside its poll loop specifically so this passes Cloud
      # Run's health checks (see app/orchestrator/worker.py). ---
      - name: Build and push agents image
        run: |
          docker build backend \
            --build-arg INSTALL_EXTRAS=asr,agents,screen,storage \
            -t "${REGISTRY}/agents:${{ github.sha }}" \
            -t "${REGISTRY}/agents:latest"
          docker push "${REGISTRY}/agents:${{ github.sha }}"
          docker push "${REGISTRY}/agents:latest"

      # Scale-to-zero, not always-on: budget-constrained deploy (GCP GenAI
      # App Builder trial credit only, no backing payment method) can't
      # absorb a permanently-open vCPU (~$60-65/month at 1 vCPU + 512Mi
      # regardless of traffic). VS_WORKER_MODE=http switches the entrypoint
      # from an infinite poll loop to an HTTP server that only does work
      # when Cloud Scheduler calls POST /run (see app/orchestrator/
      # worker.py's serve_http/run_bounded_pass and the Cloud Scheduler
      # setup note at the bottom of this file). --timeout is set well above
      # settings.worker_pass_max_seconds (300s) so a deep queue can't be cut
      # off mid-pass. --min-instances=0 and --cpu-throttling are passed
      # EXPLICITLY, not just omitted -- verified empirically that `gcloud
      # run deploy` treats scaling annotations as sticky across revisions:
      # a deploy that previously set --min-instances=1/--no-cpu-throttling
      # and then merely stops passing those flags does NOT reset them, it
      # silently keeps the old (expensive) values. Omitting them here would
      # look correct in this file while the live service kept billing for
      # an always-on instance.
      - name: Deploy agents to Cloud Run
        run: |
          AGENTS_SECRETS="VS_DATABASE_URL=visualsprint-database-url:latest"
          AGENTS_SECRETS="${AGENTS_SECRETS},/secrets/google-speech-credentials.json=visualsprint-google-speech-credentials:latest"
          AGENTS_SECRETS="${AGENTS_SECRETS},VS_AZURE_SPEECH_KEY=visualsprint-azure-speech-key:latest"
          AGENTS_SECRETS="${AGENTS_SECRETS},VS_AZURE_SPEECH_REGION=visualsprint-azure-speech-region:latest"
          AGENTS_SECRETS="${AGENTS_SECRETS},VS_HUGGINGFACE_TOKEN=visualsprint-huggingface-token:latest"
          # OAuth client credentials -- the worker needs its own copy of
          # these, not just `api`. Real gap found live: the calendar-sync
          # sweep (app/orchestrator/worker.py::_sync_all_calendars, which
          # only this service runs) calls build_org_token_provider ->
          # get_provider_config, which raises OAuthNotConfiguredError
          # without these -- silently degrading every connection to
          # "calendar_sync.unknown_provider" even though the OAuth grant
          # itself succeeded and the CalendarConnection row is real.
          #
          # VS_SECRETSTORE_BACKEND=gcp (set below, in --set-env-vars) closes a
          # related, worse gap found live 2026-08-18: this flag was previously
          # set on the bot Cloud Run Job only, so this service (and `api`)
          # silently used the default "local" SecretStore, which writes OAuth
          # tokens to the container's own ephemeral disk -- gone on next
          # deploy, and never visible to this service in the first place
          # (each service is a separate container). Every calendar sync since
          # has failed with "secret not found: 'oauth/<provider>/<uuid>'" --
          # zero meetings, zero bot sessions ever created. See
          # docs/14-production-status.md. Also requires
          # roles/secretmanager.admin on visualsprint-backend-service-a
          # (granted once, not per-deploy -- see the setup notes at the
          # bottom of this file).
          # Google/Microsoft: calendar sync + Meet/Teams artifact pulling.
          # Zoom (OAuth app, not the S2S/RTMS one): cloud-recording
          # artifact pulling (Mode A2). Jira: work-tracking status sweep.
          # Slack and VS_OAUTH_STATE_SECRET stay api-only -- nothing this
          # service does touches either.
          AGENTS_SECRETS="${AGENTS_SECRETS},VS_GOOGLE_OAUTH_CLIENT_ID=visualsprint-google-oauth-client-id:latest"
          AGENTS_SECRETS="${AGENTS_SECRETS},VS_GOOGLE_OAUTH_CLIENT_SECRET=visualsprint-google-oauth-client-secret:latest"
          AGENTS_SECRETS="${AGENTS_SECRETS},VS_MICROSOFT_OAUTH_CLIENT_ID=visualsprint-microsoft-oauth-client-id:latest"
          AGENTS_SECRETS="${AGENTS_SECRETS},VS_MICROSOFT_OAUTH_CLIENT_SECRET=visualsprint-microsoft-oauth-client-secret:latest"
          AGENTS_SECRETS="${AGENTS_SECRETS},VS_ZOOM_OAUTH_CLIENT_ID=visualsprint-zoom-oauth-client-id:latest"
          AGENTS_SECRETS="${AGENTS_SECRETS},VS_ZOOM_OAUTH_CLIENT_SECRET=visualsprint-zoom-oauth-client-secret:latest"
          AGENTS_SECRETS="${AGENTS_SECRETS},VS_JIRA_OAUTH_CLIENT_ID=visualsprint-jira-oauth-client-id:latest"
          AGENTS_SECRETS="${AGENTS_SECRETS},VS_JIRA_OAUTH_CLIENT_SECRET=visualsprint-jira-oauth-client-secret:latest"
          gcloud run deploy visualsprint-agents \
            --image "${REGISTRY}/agents:${{ github.sha }}" \
            --region "$REGION" --project "$PROJECT_ID" \
            --service-account="visualsprint-backend-service-a@${PROJECT_ID}.iam.gserviceaccount.com" \
            --command python \
            --args="-m,app.orchestrator.worker" \
            --set-secrets="$AGENTS_SECRETS" \
            --set-env-vars="VS_GOOGLE_CREDENTIALS_JSON=/secrets/google-speech-credentials.json,VS_LLM_PROVIDER=gemini,VS_WORKER_MODE=http,VS_BLOB_BACKEND=gcs,VS_GCS_BUCKET=visualsprint-blobs-${PROJECT_ID},VS_BOT_DISPATCH_ENABLED=true,VS_BOT_DISPATCH_MODE=cloud_run_job,VS_BOT_CLOUD_RUN_JOB_NAME=visualsprint-bot,VS_BOT_CLOUD_RUN_PROJECT=${PROJECT_ID},VS_BOT_CLOUD_RUN_REGION=${REGION},VS_SECRETSTORE_BACKEND=gcp,VS_DIARIZATION_ENABLED=false" \
            --memory=1Gi \
            --timeout=600 \
            --min-instances=0 --max-instances=2 \
            --cpu-throttling \
            --quiet

      # --- Bot: lean image -- just Playwright + core deps, no ML/torch/paddleocr.
      # One Cloud Run Job execution = one meeting. The job reads VS_BOT_SESSION_ID
      # from its container environment (set per-execution by the agents service).
      - name: Build and push bot image
        run: |
          docker build backend \
            --build-arg INSTALL_EXTRAS=bot \
            -t "${REGISTRY}/bot:${{ github.sha }}" \
            -t "${REGISTRY}/bot:latest"
          docker push "${REGISTRY}/bot:${{ github.sha }}"
          docker push "${REGISTRY}/bot:latest"

      - name: Create or update bot Cloud Run Job
        run: |
          BOT_SECRETS="VS_DATABASE_URL=visualsprint-database-url:latest"
          BOT_SECRETS="${BOT_SECRETS},VS_GOOGLE_OAUTH_CLIENT_ID=visualsprint-google-oauth-client-id:latest"
          BOT_SECRETS="${BOT_SECRETS},VS_GOOGLE_OAUTH_CLIENT_SECRET=visualsprint-google-oauth-client-secret:latest"
          BOT_SECRETS="${BOT_SECRETS},VS_MICROSOFT_OAUTH_CLIENT_ID=visualsprint-microsoft-oauth-client-id:latest"
          BOT_SECRETS="${BOT_SECRETS},VS_MICROSOFT_OAUTH_CLIENT_SECRET=visualsprint-microsoft-oauth-client-secret:latest"
          # Guest mode is the permanent production path for Meet bots.  It
          # never reads a Google browser-cookie secret; browser sessions are
          # intentionally not an operational dependency because Google can
          # revoke them and OAuth refresh tokens cannot renew them.
          BOT_ENV="VS_SECRETSTORE_BACKEND=gcp,VS_BLOB_BACKEND=gcs,VS_GCS_BUCKET=visualsprint-blobs-${PROJECT_ID},VS_BOT_GOOGLE_JOIN_MODE=guest"
          BOT_ARGS="--image=${REGISTRY}/bot:${{ github.sha }}"
          BOT_ARGS="${BOT_ARGS} --region=${REGION} --project=${PROJECT_ID}"
          BOT_ARGS="${BOT_ARGS} --service-account=visualsprint-backend-service-a@${PROJECT_ID}.iam.gserviceaccount.com"
          BOT_ARGS="${BOT_ARGS} --command=python --args=-m,app.bot.job"
          BOT_ARGS="${BOT_ARGS} --set-secrets=${BOT_SECRETS}"
          BOT_ARGS="${BOT_ARGS} --set-env-vars=${BOT_ENV}"
          BOT_ARGS="${BOT_ARGS} --max-retries=0"
          BOT_ARGS="${BOT_ARGS} --task-timeout=14400"
          BOT_ARGS="${BOT_ARGS} --memory=2Gi"
          # Static outbound IP via Cloud NAT (router=visualsprint-router,
          # static addr=visualsprint-bot-nat-ip, connector=visualsprint-connector,
          # all created once in us-west1). --vpc-egress=all-traffic forces ALL
          # egress (including to Google Meet/accounts.google.com) through the
          # connector -> Cloud NAT -> same static IP every run. Without this the
          # container gets a different ephemeral IP each cold start, and Google
          # invalidates the stored session within ~1-2 hours of first use.
          BOT_ARGS="${BOT_ARGS} --vpc-connector=visualsprint-connector"
          BOT_ARGS="${BOT_ARGS} --vpc-egress=all-traffic"
          BOT_ARGS="${BOT_ARGS} --quiet"
          if gcloud run jobs describe visualsprint-bot \
               --region="${REGION}" --project="${PROJECT_ID}" 2>/dev/null; then
            # shellcheck disable=SC2086
            gcloud run jobs update visualsprint-bot ${BOT_ARGS}
          else
            # shellcheck disable=SC2086
            gcloud run jobs create visualsprint-bot ${BOT_ARGS}
          fi

      # Grant the agents runtime SA permission to invoke the bot job.
      # Idempotent -- add-iam-policy-binding is a union operation, so
      # re-running on every deploy is safe and cheaper than checking first.
      - name: Grant agents SA permission to invoke bot job
        run: |
          gcloud run jobs add-iam-policy-binding visualsprint-bot \
            --region="${REGION}" --project="${PROJECT_ID}" \
            --member="serviceAccount:visualsprint-backend-service-a@${PROJECT_ID}.iam.gserviceaccount.com" \
            --role="roles/run.developer" \
            --quiet

      # --- Cloud Scheduler: triggers the agents worker every 2 minutes ---
      # The agents service runs in VS_WORKER_MODE=http (scale-to-zero) --
      # it only processes the pipeline queue and dispatches bot sessions when
      # something POSTs to /run. Cloud Scheduler provides that trigger.
      # This step is idempotent: it creates the scheduler SA and job on first
      # deploy and updates the job URI on subsequent deploys (in case the
      # agents Cloud Run URL ever changes).
      - name: Resolve agents URL for Cloud Scheduler
        id: agents_url
        run: |
          URL=$(gcloud run services describe visualsprint-agents \
            --region "$REGION" --project "$PROJECT_ID" \
            --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Create Cloud Scheduler SA (idempotent)
        run: |
          if ! gcloud iam service-accounts describe \
                "visualsprint-scheduler@${PROJECT_ID}.iam.gserviceaccount.com" \
                --project="${PROJECT_ID}" >/dev/null 2>&1; then
            gcloud iam service-accounts create visualsprint-scheduler \
              --project="${PROJECT_ID}" \
              --display-name="Cloud Scheduler -> visualsprint-agents /run" \
              --quiet
          fi

      - name: Grant Scheduler SA permission to invoke agents service
        run: |
          gcloud run services add-iam-policy-binding visualsprint-agents \
            --region="${REGION}" --project="${PROJECT_ID}" \
            --member="serviceAccount:visualsprint-scheduler@${PROJECT_ID}.iam.gserviceaccount.com" \
            --role="roles/run.invoker" \
            --quiet

      - name: Create or update Cloud Scheduler job for agents worker
        run: |
          AGENTS_URL="${{ steps.agents_url.outputs.url }}"
          SCHEDULER_SA="visualsprint-scheduler@${PROJECT_ID}.iam.gserviceaccount.com"
          if gcloud scheduler jobs describe visualsprint-agents-run \
               --project="${PROJECT_ID}" --location="${REGION}" >/dev/null 2>&1; then
            gcloud scheduler jobs update http visualsprint-agents-run \
              --project="${PROJECT_ID}" --location="${REGION}" \
              --schedule="*/2 * * * *" \
              --uri="${AGENTS_URL}/run" \
              --http-method=POST \
              --oidc-service-account-email="${SCHEDULER_SA}" \
              --oidc-token-audience="${AGENTS_URL}" \
              --quiet
          else
            gcloud scheduler jobs create http visualsprint-agents-run \
              --project="${PROJECT_ID}" --location="${REGION}" \
              --schedule="*/2 * * * *" \
              --uri="${AGENTS_URL}/run" \
              --http-method=POST \
              --oidc-service-account-email="${SCHEDULER_SA}" \
              --oidc-token-audience="${AGENTS_URL}" \
              --quiet
          fi

      # --- Web: needs the api's live URL baked in at build time (Next.js
      # inlines NEXT_PUBLIC_* into the client bundle) -- fetched fresh
      # rather than hardcoded, so this stays correct if the api service URL
      # ever changes. ---
      - name: Resolve api URL for the frontend build
        id: api_url
        run: |
          URL=$(gcloud run services describe visualsprint-api \
            --region "$REGION" --project "$PROJECT_ID" \
            --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Build and push web image
        run: |
          docker build frontend \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${{ steps.api_url.outputs.url }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -t "${REGISTRY}/web:${{ github.sha }}" \
            -t "${REGISTRY}/web:latest"
          docker push "${REGISTRY}/web:${{ github.sha }}"
          docker push "${REGISTRY}/web:latest"

      - name: Deploy web to Cloud Run
        run: |
          gcloud run deploy visualsprint-web \
            --image "${REGISTRY}/web:${{ github.sha }}" \
            --region "$REGION" --project "$PROJECT_ID" \
            --allow-unauthenticated \
            --cpu-throttling --min-instances=0 --max-instances=2 \
            --quiet

# --- Setup required once, not per-run ---
#
# Grant the deploy SA permission to create GCS buckets (run once, as a
# project owner -- the deploy SA cannot grant itself this permission):
#   gcloud projects add-iam-policy-binding visualsprint-agent \
#     --member="serviceAccount:github-actions-deploy@visualsprint-agent.iam.gserviceaccount.com" \
#     --role="roles/storage.admin"
# Without this, gsutil mb silently fails (the || true was hiding this),
# and the next IAM step errors with "bucket does not exist".
#
# Grant the runtime SA permission to read/write OAuth tokens in Secret
# Manager (run once -- app/adapters/secretstore_gcp.py needs create_secret,
# add_secret_version, access_secret_version, delete_secret):
#   gcloud projects add-iam-policy-binding visualsprint-agent \
#     --member="serviceAccount:visualsprint-backend-service-a@visualsprint-agent.iam.gserviceaccount.com" \
#     --role="roles/secretmanager.admin"
# Without this, VS_SECRETSTORE_BACKEND=gcp (set on api + agents below) fails
# closed -- every OAuth connection appears to succeed in the UI but the
# calendar/RTMS/action-connector code that reads the token back later 403s
# or KeyErrors, degrading silently to "not connected" behavior. This is
# exactly the failure mode diagnosed in docs/14-production-status.md.
#
# Zoom S2S account ID (one-time, from the RTMS app's "App Credentials" page,
# NOT the same as VS_ZOOM_CLIENT_ID -- account_credentials token requests
# reject the literal string "me"):
#   printf '<account-id>' | gcloud secrets versions add \
#     visualsprint-zoom-account-id --project=visualsprint-agent --data-file=-
#
# Repo variables (Settings -> Secrets and variables -> Actions -> Variables
# tab -- these are non-secret identifiers, WIF needs no secret credential):
#   GCP_PROJECT_ID                = visualsprint-agent
#   GCP_REGION                    = us-west1
#   GCP_WORKLOAD_IDENTITY_PROVIDER = projects/530780341550/locations/global/workloadIdentityPools/github-pool/providers/github-provider
#   GCP_SERVICE_ACCOUNT           = github-actions-deploy@visualsprint-agent.iam.gserviceaccount.com
#   NEXT_PUBLIC_SUPABASE_URL      = https://<project-ref>.supabase.co
#   NEXT_PUBLIC_SUPABASE_ANON_KEY = <anon key, from Supabase project settings -> API>
#     (the anon key is safe as a plain repo Variable, not a Secret -- it is
#     designed to be public and ends up baked into the browser bundle either
#     way; Row Level Security, not secrecy, is what protects the database.
#     NEVER put the service_role key here or anywhere in frontend/ -- it
#     bypasses RLS entirely and must stay backend-only, if used at all.)
#
# Trust boundary: the WIF provider's attribute condition currently allows
# BOTH this repo and VisualSprint-Labs/visualsprint-agent (an earlier,
# unrelated scaffold project sharing this same GCP project). Narrow it to
# this repo only once that other repo's access is confirmed no longer
# needed -- see `gcloud iam workload-identity-pools providers update-oidc`.
#
# Database: api and agents both read VS_DATABASE_URL from the Secret
# Manager secret `visualsprint-database-url` (granted to the runtime service
# account visualsprint-backend-service-a@..., NOT the deploy SA above --
# deploying only needs permission to *reference* the secret, not read it).
# That secret currently holds a placeholder
# (postgresql+psycopg://NOT_YET_CONFIGURED:...@example.invalid:5432/...) --
# deploys will keep succeeding but the container will fail its DB connection
# until a real value is added. No code or workflow changes needed once it
# is real -- Cloud Run always resolves `:latest` on each new revision:
#   printf '%s' 'postgresql+psycopg://user:pass@host:5432/db' | \
#     gcloud secrets versions add visualsprint-database-url \
#       --project=visualsprint-agent --data-file=-
# Then redeploy (push, or re-run this workflow) to pick it up. If using
# Supabase specifically, use the Session pooler connection string, not
# Transaction pooler -- transaction-mode pooling can break some
# SQLAlchemy/Alembic behavior.
#
# Google ASR (chirp_2): the agents service mounts
# `visualsprint-google-speech-credentials` (a service-account key JSON for
# visualsprint-asr@visualsprint-agent.iam.gserviceaccount.com, which holds
# only roles/speech.client -- least privilege, recognition calls only) as a
# *file* at /secrets/google-speech-credentials.json via --set-secrets'
# path=secret syntax, and VS_GOOGLE_CREDENTIALS_JSON points at that path
# (app/config.py's field is a file path, not inline JSON content -- see
# app/adapters/asr_google.py). Real key already generated and stored; this
# one is live, not a placeholder. The `api` service does not need it (only
# the agents/worker image calls the ASR cascade).
# Azure Speech (VS_AZURE_SPEECH_KEY/_REGION) is wired via Secret Manager as
# of 2026-08-11. Groq (VS_GROQ_API_KEY) is still NOT wired -- no account has
# been created for it yet, so there's no value to store.
#
# OAuth clients (Slack, Zoom OAuth app + Zoom Server-to-Server, Microsoft,
# Jira) and VS_OAUTH_STATE_SECRET are wired into the `api` service via
# Secret Manager as of 2026-08-11 (secret names: visualsprint-<vendor>-...,
# see the loop above). GitHub and Linear OAuth apps have not been created
# yet -- VS_GITHUB_OAUTH_CLIENT_ID/SECRET and VS_LINEAR_OAUTH_CLIENT_ID/SECRET
# have no value to store until that happens.
#
# VS_SUPABASE_URL, VS_CORS_ALLOWED_ORIGINS, VS_OAUTH_REDIRECT_BASE_URL, and
# VS_FRONTEND_BASE_URL are set as plain (non-secret) env vars on `api` --
# these are public URLs, not credentials. All four are load-bearing: without
# VS_SUPABASE_URL every authenticated request 401s (JWT verification can't
# reach Supabase's JWKS endpoint); without VS_CORS_ALLOWED_ORIGINS pointing
# at the real web origin, the browser blocks every fetch from the deployed
# frontend to the deployed api. If either Cloud Run URL ever changes (e.g.
# service recreated in a different region), these hardcoded values need a
# manual update here.
#
# Cloud Scheduler (agents/worker trigger, set up once, not per-run):
# visualsprint-agents runs with no --min-instances, so nothing invokes it
# unless something calls POST /run. `visualsprint-agents` is NOT
# --allow-unauthenticated -- deliberately, since this endpoint drains the
# job queue and would otherwise be a free-for-all trigger for anyone who
# finds the URL. Cloud Scheduler needs its own invoker identity:
#   gcloud iam service-accounts create visualsprint-scheduler \
#     --project=visualsprint-agent \
#     --display-name="Cloud Scheduler -> visualsprint-agents /run"
#   gcloud run services add-iam-policy-binding visualsprint-agents \
#     --region=us-west1 --project=visualsprint-agent \
#     --member="serviceAccount:visualsprint-scheduler@visualsprint-agent.iam.gserviceaccount.com" \
#     --role="roles/run.invoker"
#   gcloud scheduler jobs create http visualsprint-agents-run \
#     --project=visualsprint-agent --location=us-west1 \
#     --schedule="*/2 * * * *" \
#     --uri="https://<agents-service-url>/run" \
#     --http-method=POST \
#     --oidc-service-account-email="visualsprint-scheduler@visualsprint-agent.iam.gserviceaccount.com" \
#     --oidc-token-audience="https://<agents-service-url>"
# Every 2 minutes is a deliberate balance: frequent enough that a real
# meeting doesn't sit queued for long, infrequent enough that idle-queue
# invocations (which return almost instantly -- see run_bounded_pass's
# empty-queue test) stay a rounding error next to what the old always-on
# instance cost. Adjust --schedule if that trade-off needs to move either
# way.
