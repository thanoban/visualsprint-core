[project]
name = "visualsprint-backend"
version = "0.1.0"
description = "VisualSprint — multilingual meeting intelligence backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]
asr = [
    "google-cloud-speech>=2.27",
    "azure-cognitiveservices-speech>=1.40",
    "groq>=0.11",
    "soundfile>=0.12",   # audio slicing for VAD/LID/vendor windows
    "numpy>=1.26",
    "torch>=2.2",        # Silero VAD, VoxLingua107 backend
    "speechbrain>=1.0",  # VoxLingua107 language ID
]
agents = [
    "anthropic[vertex]>=0.40",
]
screen = [
    "opencv-python>=4.10",
    "imagehash>=4.3",
    "scikit-image>=0.24",
    "numpy>=1.26",
    "Pillow>=10.4",
    "paddleocr>=2.9",
    "pyannote.audio>=3.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",  # FastAPI intentionally calls Depends/File/Form in endpoint defaults.
    "E501",  # Ruff's formatter owns wrapping; long URLs/comments remain readable.
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
