[project]
name = "visualsprint-backend"
version = "0.1.0"
description = "VisualSprint — multilingual meeting intelligence backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.4",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]
# Runtime libraries the test suite actually exercises in CI (`pip install -e
# .[dev,test]`). Deliberately the LIGHT/moderate subset of the asr/screen/
# agents/storage extras -- the heavy GPU/browser deps (torch, speechbrain,
# paddleocr, pyannote.audio, playwright) are excluded because every test that
# would touch them substitutes a fake, and `anthropic` is excluded because the
# default provider is Gemini and the Claude adapter tests bypass __init__ with a
# fake client. opencv-python-headless (not opencv-python) avoids the libGL
# system dependency absent on CI runners.
test = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "opencv-python-headless>=4.10",
    "imagehash>=4.3",
    "scikit-image>=0.24",
    "Pillow>=10.4",
    "google-cloud-speech>=2.27",
    "google-cloud-aiplatform>=1.70",
    "google-genai>=1.0",
    "google-cloud-storage>=2.18",
    "google-cloud-secret-manager>=2.20",
    "google-auth>=2.35",
    "azure-cognitiveservices-speech>=1.40",
    "groq>=0.11",
    "botocore>=1.35",
]
asr = [
    "google-cloud-speech>=2.27",
    "azure-cognitiveservices-speech>=1.40",
    "groq>=0.11",
    "soundfile>=0.12",   # audio slicing for VAD/LID/vendor windows
    "numpy>=1.26",
    "torch>=2.2",        # Silero VAD, VoxLingua107 backend
    "speechbrain>=1.0",  # VoxLingua107 language ID
]
agents = [
    "anthropic[vertex]>=0.40",  # Claude LlmClient (app/adapters/llm_vertex.py) -- not the default provider, kept available
    "google-cloud-aiplatform>=1.70",  # Embedder swap point (app/adapters/embedder_vertex.py)
    "google-genai>=1.0",  # Default Gemini LlmClient (app/adapters/llm_gemini_vertex.py) -- imported directly, not just transitively via google-cloud-aiplatform
    "google-cloud-storage>=2.18",  # GCS BlobStore (app/adapters/blobstore_gcs.py) -- shared blob store for prod
]
screen = [
    "opencv-python>=4.10",
    "imagehash>=4.3",
    "scikit-image>=0.24",
    "numpy>=1.26",
    "Pillow>=10.4",
    "paddleocr>=2.9",
    "pyannote.audio>=3.3",  # speaker diarization (app/adapters/diarizer_pyannote.py)
    "omegaconf>=2.3",  # pyannote loads model configs through it but does NOT declare it — verified missing against pyannote-audio 4.0.7, whose own metadata omits it
]
storage = [
    "botocore>=1.35",  # SigV4 signing only, not the full boto3 SDK -- see adapters/blobstore_s3.py
    "google-cloud-secret-manager>=2.20",  # see adapters/secretstore_gcp.py
    "google-cloud-storage>=2.18",  # GCS BlobStore -- api image needs this for blob uploads
    "google-auth>=2.35",  # ADC credential resolution (metadata server on Cloud Run)
]
bot = [
    "playwright>=1.47",  # Mode B guest-bot join (app/bot/, app/adapters/bot_*.py)
    "Pillow>=10.4",  # bounded perceptual screen-frame selection
    "google-cloud-storage>=2.18",  # GCS BlobStore -- bot stores recordings to shared GCS bucket
    "google-auth>=2.35",  # ADC credential refresh for GCS signed URLs
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",  # FastAPI intentionally calls Depends/File/Form in endpoint defaults.
    "E501",  # Ruff's formatter owns wrapping; long URLs/comments remain readable.
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
